[project]
name = "conduit-client-core"
version = "0.1.4"
description = "Conduit client-app smart local proxy: SOCKS5 + route resolver + cache + macOS system proxy switch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10.0",
    "zeroconf>=0.131.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["conduit_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
