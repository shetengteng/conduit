[workspace]
resolver = "2"
members = [
    "crates/conduit-core",
    "server-app/src-tauri",
    "client-app/src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.78"
authors = ["TerrellShe"]

[workspace.dependencies]
# 当前实际已使用的依赖；hyper / mdns-sd / fast-socks5 / moka 等按 Sprint 进度逐步追加
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
portpicker = "0.1"
once_cell = "1"
libc = "0.2"
# S1.3 PAC 引擎平移所需
regex = "1"
globset = "0.4"
ipnet = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
