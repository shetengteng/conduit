name: build-dmg

# 触发：
#   1. 推 tag (v*) → 自动 build + 创建 GitHub Release
#   2. 手动 workflow_dispatch → 仅 build，dmg 上传到 workflow artifact，
#      用于在另一台机器下载验证（不打 tag 不发 release）
#
# 矩阵：macos-15 (Apple Silicon, aarch64) + macos-15-intel (Intel, x86_64)
# 跨平台编译不支持（Tauri 依赖本机 toolchain 出 .app/.dmg），所以两个 runner 各跑一次。
# Intel 镜像 macos-15-intel 是 GitHub 提供的最后一代 x86_64 镜像（EOL: 2027-08）。
#
# 未公证：默认 ad-hoc 签名（APPLE_SIGNING_IDENTITY=-），可在 Apple Silicon
# 上避免 "App Is Damaged" 错。完整公证需要 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
# 三个 secret，未配置时跳过。用户首次打开仍可能被 Gatekeeper 拦截 → 解决：
# `xattr -dr com.apple.quarantine /Applications/Conduit*.app` 或 Ctrl+Click → 打开。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        type: choice
        options:
          - both
          - server
          - client
        default: both

permissions:
  contents: write   # 上传 release asset 需要

jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: macos-15 是 2026 年 Q2 的当前默认（macos-latest）
          - runner: macos-15
            arch: aarch64
          # Intel: macos-15-intel 是 GitHub 提供的最后一代 x86_64 镜像
          # （macos-13 已 EOL；x86_64 支持到 2027-08，之后只能自建 runner）
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.3

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      # 只缓存依赖下载结果（~/.cargo/{registry,git}），故意不缓存
      # server-app/src-tauri/target 和 client-app/src-tauri/target。
      # 缓存 target/ 时 GitHub Actions 会把 target/release/bundle/dmg/*.dmg
      # 一并打进缓存，下次 build 命中缓存后 Tauri bundler 看到 binary
      # 时间戳没变就跳过 bundle 重建，直接复用上一版的 .dmg，造成版本号
      # 与 tauri.conf.json 不一致（v0.2.0 release 实际打出 0.1.0 命名的
      # dmg、体积不缩水就是这么来的）。Rust crate 每次全量编译会增加
      # 5-10 分钟，但 release 频率低，换来 100% 干净产物，值得。
      - name: cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.arch }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: build bundle
        env:
          # workflow_dispatch 才有 inputs.app；tag push 时为空，默认 both
          APP_INPUT: ${{ inputs.app || 'both' }}
          # ad-hoc codesign：让 Apple Silicon 不报 "App Is Damaged" 错。
          # 无需 Apple Developer 账号；用户首次打开仍需 xattr -dr com.apple.quarantine
          # 或在 Finder 里 Ctrl+Click → 打开。
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          chmod +x scripts/release.sh
          if [[ "$APP_INPUT" == "both" ]]; then
            ./scripts/release.sh
          else
            ./scripts/release.sh "$APP_INPUT"
          fi

      - name: list artifacts
        run: |
          ls -lh dist/server/ 2>/dev/null || true
          ls -lh dist/client/ 2>/dev/null || true

      # 按 app + arch 拆成 4 个独立 artifact（server-aarch64 / server-x86_64 /
      # client-aarch64 / client-x86_64），下载侧更直观，可以只下需要的那个。
      #
      # if-no-files-found 必须用 error（不能用 ignore）—— 否则 tauri build 静默
      # 失败、dist/<app>/*.dmg 为空时，build job 仍会 success，下游 release job
      # download-artifact 拉到 0 个 artifact，artifacts/ 目录甚至不会被创建
      # （v7 已知行为），最终 `ls -lhR artifacts/` exit 2，把锅甩给 release
      # 而非真正的 build 故障，难排查。
      #
      # workflow_dispatch 选 "server" 时不能跑 "upload client dmg"（dist/client/
      # 根本不存在），所以这里用 step-level if 跳过整个 step，而不是靠 ignore。
      # tag push 触发时 inputs.app 不存在（== null），按默认 both 处理。
      - name: upload server dmg
        if: ${{ inputs.app == null || inputs.app == 'both' || inputs.app == 'server' }}
        uses: actions/upload-artifact@v7
        with:
          name: conduit-server-${{ matrix.arch }}
          path: dist/server/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: upload client dmg
        if: ${{ inputs.app == null || inputs.app == 'both' || inputs.app == 'client' }}
        uses: actions/upload-artifact@v7
        with:
          name: conduit-client-${{ matrix.arch }}
          path: dist/client/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # download-artifact@v7 在 build matrix 一个 artifact 都没产出时
      # 不会创建 artifacts/ 目录（issue #455），裸 ls 会 exit 2 且只看到
      # "No such file or directory"，无法判断是 build 没出 dmg 还是
      # download 步骤本身出错。这里先做存在性检查并给出明确指引。
      - name: list collected files
        run: |
          if [[ ! -d artifacts ]]; then
            echo "✗ artifacts/ 不存在 —— build matrix 没有任何 artifact 产出"
            echo "  请回到上游 build-* job 查看 'build bundle' / 'list artifacts' 的日志。"
            exit 1
          fi
          ls -lhR artifacts/
          dmg_count=$(find artifacts -name '*.dmg' -type f | wc -l | tr -d ' ')
          echo ""
          echo "→ 共找到 ${dmg_count} 个 .dmg 文件"
          if [[ "$dmg_count" == "0" ]]; then
            echo "✗ 没有 .dmg 可发布，终止 release"
            exit 1
          fi

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 安装

            按你 Mac 的架构下载对应文件：

            - **Apple Silicon (M1/M2/M3/M4)**: 文件名带 `aarch64`
            - **Intel Mac**: 文件名带 `x86_64`

            首次打开被 Gatekeeper 拦截 → 在终端执行：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Conduit Server.app"
            xattr -dr com.apple.quarantine "/Applications/Conduit Client.app"
            ```

            或在 Finder 里右键（Ctrl+Click）→ 打开 → 确认。

            ## 已知限制

            未签名 / 未公证：需要 Apple Developer 账号和 `APPLE_ID` / `APPLE_PASSWORD` / `APPLE_TEAM_ID` secret。
